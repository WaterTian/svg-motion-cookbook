<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 140" font-family="ui-monospace, Menlo, monospace">
  <title>Pattern 6 — Color shimmer</title>
  <desc>A text element whose fill linearly interpolates between two neighboring palette colors and back.</desc>

  <rect width="360" height="140" fill="#1e1e2e" rx="8"/>
  <text x="20" y="30" font-size="12" fill="#7f849c">06 — color shimmer</text>

  <text x="180" y="80" font-size="36" font-weight="600" text-anchor="middle" fill="#cba6f7">
    brand
    <animate attributeName="fill"
             values="#cba6f7;#e8d4ff;#cba6f7"
             dur="4s" repeatCount="indefinite"/>
  </text>

  <text x="20" y="120" font-size="10" fill="#585b70">use palette neighbors; distant colors interpolate through a muddy midpoint</text>
</svg>
