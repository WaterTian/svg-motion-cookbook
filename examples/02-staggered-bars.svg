<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" font-family="ui-monospace, Menlo, monospace">
  <title>Pattern 2 — Staggered begin</title>
  <desc>Four bars sharing one 6s cycle but staggered by 0.3s begin offsets, producing a wave.</desc>

  <rect width="360" height="200" fill="#1e1e2e" rx="8"/>
  <text x="20" y="30" font-size="12" fill="#7f849c">02 — staggered begin</text>

  <!-- Four bars, identical animation, only `begin` differs. -->
  <g>
    <rect x="20" y="60" width="320" height="10" fill="#313244" rx="2"/>
    <rect x="20" y="60" width="0" height="10" fill="#89b4fa" rx="2">
      <animate attributeName="width" values="0;320;320;0" keyTimes="0;0.22;0.85;1"
               dur="6s" begin="0s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g>
    <rect x="20" y="80" width="320" height="10" fill="#313244" rx="2"/>
    <rect x="20" y="80" width="0" height="10" fill="#cba6f7" rx="2">
      <animate attributeName="width" values="0;320;320;0" keyTimes="0;0.22;0.85;1"
               dur="6s" begin="0.3s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g>
    <rect x="20" y="100" width="320" height="10" fill="#313244" rx="2"/>
    <rect x="20" y="100" width="0" height="10" fill="#a6e3a1" rx="2">
      <animate attributeName="width" values="0;320;320;0" keyTimes="0;0.22;0.85;1"
               dur="6s" begin="0.6s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g>
    <rect x="20" y="120" width="320" height="10" fill="#313244" rx="2"/>
    <rect x="20" y="120" width="0" height="10" fill="#f9e2af" rx="2">
      <animate attributeName="width" values="0;320;320;0" keyTimes="0;0.22;0.85;1"
               dur="6s" begin="0.9s" repeatCount="indefinite"/>
    </rect>
  </g>

  <text x="20" y="170" font-size="10" fill="#585b70">begin offsets: 0s · 0.3s · 0.6s · 0.9s (not divisors of 6s)</text>
</svg>
