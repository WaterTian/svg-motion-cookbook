<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 140" font-family="ui-monospace, Menlo, monospace">
  <title>Pattern 4 — Text-content swap via opacity overlay</title>
  <desc>Three text values stacked at the same x/y; calcMode=discrete opacity rotates which one is visible.</desc>

  <rect width="360" height="140" fill="#1e1e2e" rx="8"/>
  <text x="20" y="30" font-size="12" fill="#7f849c">04 — text swap (discrete)</text>

  <text x="20" y="80" font-size="32" fill="#cdd6f4">5h:</text>

  <!--
    Three overlaid texts at the same anchor. Each animates opacity with calcMode=discrete
    so transitions are crisp cuts, no fade. The 3s cycle splits into three equal slots:
      slot 1 (0    – 0.33): show "62%"
      slot 2 (0.33 – 0.66): show "63%"
      slot 3 (0.66 – 1.00): show "64%"
  -->
  <text x="90" y="80" font-size="32" fill="#f9e2af">62%
    <animate attributeName="opacity" calcMode="discrete"
             values="1;0;1" keyTimes="0;0.33;1"
             dur="3s" repeatCount="indefinite"/>
  </text>
  <text x="90" y="80" font-size="32" fill="#f9e2af" opacity="0">63%
    <animate attributeName="opacity" calcMode="discrete"
             values="0;1;0;1;0" keyTimes="0;0.33;0.34;0.66;0.67"
             dur="3s" repeatCount="indefinite"/>
  </text>
  <text x="90" y="80" font-size="32" fill="#f9e2af" opacity="0">64%
    <animate attributeName="opacity" calcMode="discrete"
             values="0;1" keyTimes="0;0.66"
             dur="3s" repeatCount="indefinite"/>
  </text>

  <text x="20" y="120" font-size="10" fill="#585b70">pad shorter values with leading spaces if widths differ; calcMode=discrete is essential</text>
</svg>
