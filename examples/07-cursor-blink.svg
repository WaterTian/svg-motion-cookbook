<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 120" font-family="ui-monospace, Menlo, monospace">
  <title>Pattern 7 — Discrete blink (terminal cursor)</title>
  <desc>A vertical-bar glyph that snaps on/off at 1.06s — the cadence of a real macOS terminal cursor.</desc>

  <rect width="360" height="120" fill="#1e1e2e" rx="8"/>
  <text x="20" y="30" font-size="12" fill="#7f849c">07 — cursor blink (discrete)</text>

  <text x="20" y="70" font-size="22" fill="#cdd6f4">
    $ npm run dev<tspan dx="6" fill="#cdd6f4">▎
      <animate attributeName="opacity"
               calcMode="discrete"
               values="1;0" keyTimes="0;0.5"
               dur="1.06s" repeatCount="indefinite"/>
    </tspan>
  </text>

  <text x="20" y="100" font-size="10" fill="#585b70">1.06s = macOS Terminal default; 1.0–1.2s reads as "terminal-like"</text>
</svg>
